schema_version = "1.1"

[task]
name = "airquality-sentinel-rollup"
description = "An air-quality alerting pipeline returns fewer alerts than hours it was sent, and the rolling mean on the operator display sometimes disagrees with the station log; drive the gated ops service to find what the averages are actually averaging and freeze an artifact whose numbers the log supports."
keywords = ["long-horizon", "cpu-ml-engineering", "gated-ops", "data-quality", "sensors", "sklearn"]

output_path = "workspace/src/rollup.py"

[verifier]
timeout_sec = 2400.0
user = "root"

[agent]
timeout_sec = 9000.0
user = "ubuntu"

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 7168
storage_mb = 10240
gpus = 0
allow_internet = false
