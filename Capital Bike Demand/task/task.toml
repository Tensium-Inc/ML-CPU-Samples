schema_version = "1.1"

[task]
name = "capital-bike-demand-audit"
description = "Repair and release a four-month Capital Bike forecast through a signed, stateful CPU ML incident."
keywords = ["long-horizon", "hud", "forecasting", "real-data", "gated-ops", "multi-file"]
output_path = "workspace/terminal-predictions.csv"

[verifier]
timeout_sec = 2400.0
user = "root"

[agent]
timeout_sec = 9000.0
user = "ubuntu"

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 7168
storage_mb = 10240
gpus = 0
allow_internet = false
